name: build

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand (Actions tab, "Run workflow"). Tick "publish" to also make a
  # release from the chosen branch. See DEPLOY.md.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the APKs as the latest release'
        type: boolean
        default: false

# Third-party actions are pinned to a full commit SHA (the tag is in the
# comment): a moved tag cannot change what runs. The build job can only read.
# Only the publish job can write, and it runs only on main.
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # The 72 MB speech model is not in the APK (the app downloads it).
      - name: Fetch and verify the bundled model files
        run: python3 tool/fetch_models.py --bundled

      # The qiraat text tests compare the app text with these pinned sources.
      - name: Fetch and verify the qiraat sources
        run: python3 -I -X utf8 tool/data/build_qiraat.py

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The run number makes every build newer than the last, so it installs
      # as an update. The app shows the version on its home screen.
      - run: >
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          --build-number ${{ github.run_number }}
          --dart-define=APP_VERSION=0.2.${{ github.run_number }}

      # Friendly file names. No version in the name, so the link
      # releases/latest/download/Rattil.apk never changes.
      - name: Name the APKs
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Rattil.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Rattil-32bit.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rattil-apks
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: apk
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APKs as a GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rattil-apks
          path: dist

      # Direct download for testers: each build on main becomes a release, and
      # releases/latest/download/<file> always points to the newest one.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Rattil 0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Test build ${{ github.run_number }} (commit ${{ github.sha }}).

            Install: download `Rattil.apk` (most phones) or `Rattil-32bit.apk` (older phones), open it, and allow "Install unknown apps" if Android asks.

            Automatic feedback can be wrong. It does not replace a qualified teacher.
