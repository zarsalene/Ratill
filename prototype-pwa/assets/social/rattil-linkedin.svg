<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Rattil — Quran learning made free, offline, and ad-free</title>
  <desc id="desc">A LinkedIn announcement graphic for Rattil, featuring offline Quran learning, free access, no ads, and on-device AI recitation practice.</desc>
  <defs>
    <pattern id="geometry" width="112" height="112" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M56 0 112 56 56 112 0 56Z M56 22 90 56 56 90 22 56Z" fill="none" stroke="#d4a853" stroke-opacity=".14" stroke-width="1.5"/>
      <circle cx="56" cy="56" r="7" fill="none" stroke="#d4a853" stroke-opacity=".16" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f5c4d"/><stop offset="1" stop-color="#0a4038"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#133c33" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="#faf8f1"/>
  <path d="M792 0h408v1200H865c68-160 54-302-3-419-63-129-169-224-171-383C689 245 744 106 792 0Z" fill="url(#deep)"/>
  <path d="M792 0h408v1200H865c68-160 54-302-3-419-63-129-169-224-171-383C689 245 744 106 792 0Z" fill="url(#geometry)"/>
  <circle cx="1000" cy="410" r="240" fill="none" stroke="#d4a853" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="1000" cy="410" r="208" fill="none" stroke="#d4a853" stroke-opacity=".28" stroke-width="1.5"/>
  <circle cx="1000" cy="410" r="172" fill="#faf8f1" filter="url(#shadow)"/>
  <image href="rattil_play_store_512.png" x="876" y="286" width="248" height="248"/>

  <image href="../brand/rattil_mark_green.svg" x="76" y="58" width="68" height="68"/>
  <text x="160" y="104" fill="#0f5c4d" font-family="Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="-2">rattil<tspan fill="#d4a853">.</tspan></text>
  <text x="1124" y="98" text-anchor="end" fill="#ead7a2" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">A FREE QURAN LEARNING APP</text>

  <text x="84" y="262" fill="#0f5c4d" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">READ · RECITE · MEMORIZE</text>
  <text x="78" y="378" fill="#17243a" font-family="Georgia, serif" font-size="84" font-weight="400" letter-spacing="-2">Learn the Quran.</text>
  <text x="82" y="474" fill="#17243a" font-family="Georgia, serif" font-size="74" font-weight="400" letter-spacing="-1.5">One ayah at a time.</text>
  <path d="M84 514h92" stroke="#d4a853" stroke-width="4" stroke-linecap="round"/>
  <text x="84" y="566" fill="#52615c" font-family="Arial, sans-serif" font-size="26">Read, listen, practise, and build a steady habit.</text>

  <g transform="translate(84 624)">
    <rect width="220" height="62" rx="31" fill="#e7eee7"/>
    <circle cx="32" cy="31" r="15" fill="#0f5c4d"/>
    <path d="M32 20v13m-5-5 5 5 5-5M26 39h12" fill="none" stroke="#faf8f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="38" fill="#0f5c4d" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".7">WORKS OFFLINE</text>
  </g>
  <g transform="translate(320 624)">
    <rect width="148" height="62" rx="31" fill="#f3ead4"/>
    <path d="M28 21v20m-10-10h20" stroke="#a27b32" stroke-width="2.5" stroke-linecap="round"/>
    <text x="52" y="38" fill="#6f5526" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".7">100% FREE</text>
  </g>
  <g transform="translate(484 624)">
    <rect width="148" height="62" rx="31" fill="#f3ead4"/>
    <path d="M18 28h22m-18-7 14 14m0-14L22 35" stroke="#a27b32" stroke-width="2.3" stroke-linecap="round"/>
    <text x="52" y="38" fill="#6f5526" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".6">NO ADS</text>
  </g>

  <rect x="82" y="742" width="636" height="176" rx="18" fill="#fffefa" stroke="#e7e3d8" filter="url(#shadow)"/>
  <circle cx="140" cy="803" r="29" fill="#e7eee7"/>
  <path d="M129 803h22m-11-11v22m-14-4a20 20 0 0 1 29-18m0 20a20 20 0 0 1-29 18" fill="none" stroke="#0f5c4d" stroke-width="2" stroke-linecap="round"/>
  <text x="190" y="797" fill="#0f5c4d" font-family="Arial, sans-serif" font-size="23" font-weight="700">AI recitation practice, on-device.</text>
  <text x="190" y="837" fill="#52615c" font-family="Arial, sans-serif" font-size="19">Your voice is processed on your phone, not sent to</text>
  <text x="190" y="866" fill="#52615c" font-family="Arial, sans-serif" font-size="19">a cloud AI service. Practice without an internet connection.</text>

  <text x="1000" y="720" fill="#f4ebd7" font-family="Georgia, serif" font-size="31" text-anchor="middle">Your Quran journey,</text>
  <text x="1000" y="762" fill="#f4ebd7" font-family="Georgia, serif" font-size="31" text-anchor="middle">at your own pace.</text>
  <path d="M875 790h250" stroke="#d4a853" stroke-opacity=".8" stroke-width="1.5"/>
  <text x="1000" y="824" fill="#dce7df" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" letter-spacing="1">READ · LISTEN · MEMORIZE</text>

  <rect x="82" y="964" width="1036" height="122" rx="12" fill="#0f5c4d"/>
  <text x="122" y="1018" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Get Rattil for Android</text>
  <text x="122" y="1055" fill="#dce7df" font-family="Arial, sans-serif" font-size="18">Free · No ads · No account</text>
  <path d="M642 986v78" stroke="#ffffff" stroke-opacity=".26" stroke-width="1.5"/>
  <text x="684" y="1016" fill="#ead7a2" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.7">VISIT</text>
  <text x="684" y="1051" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">zarsalene.github.io/Ratill</text>

  <text x="84" y="1122" fill="#68736d" font-family="Arial, sans-serif" font-size="15">AI feedback can make mistakes. It is a practice aid, not a replacement for a qualified Quran teacher.</text>
  <text x="84" y="1150" fill="#0f5c4d" font-family="Arial, sans-serif" font-size="15" font-weight="700">Included recitations work offline. Download additional audio for offline listening.</text>
</svg>
